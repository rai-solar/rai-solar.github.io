    <style>
      :root {
        --page-padding: clamp(1.25rem, 4vw, 4rem);
        --form-bottom: clamp(4rem, 7vh, 7rem);
        --cloud-inline-overhang: clamp(1.2rem, 2.25vw, 2rem);
        --newsletter-right-offset: 0rem;
        --text-color: #000000;
        --line-color: #000000;
        --cloud-color: #ffffff;
        --cloud-hover-color: #cb5f3c;
        --interface-font-size: clamp(2rem, 3.35vw, 3rem);
        --brand-width: 34rem;
        --brand-top: clamp(4.25rem, 7.5vh, 5.75rem);
        --brand-mobile-margin: clamp(0.9rem, 4vw, 1.5rem);
        --focus-color: #000000;
        --font-sans:
          "Atkinson Hyperlegible Next",
          Arial,
          sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: #111111;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        overflow: hidden;
        color: var(--text-color);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
      }

      .page-background {
        position: fixed;
        inset: 0;
        z-index: -2;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        user-select: none;
        pointer-events: none;
      }

      .brand-lockup {
        position: fixed;
        top: var(--brand-top);
        left: 50%;
        z-index: 1;
        width: var(--brand-width);
        margin: 0;
        transform: translateX(-50%);
        user-select: none;
        pointer-events: none;
      }

      .brand-logo {
        display: block;
        width: 100%;
        height: auto;
      }

      .brand-status {
        margin: 0.55rem 0 0;
        font-size: 1.35rem;
        font-weight: 400;
        line-height: 1;
        letter-spacing: -0.025em;
        text-align: right;
      }

      .newsletter {
        position: fixed;
        right: calc(
          var(--page-padding) +
          var(--newsletter-right-offset)
        );
        bottom: var(--form-bottom);
        left: var(--page-padding);
        z-index: 1;
      }

      .inf-form,
      .inf-main_6ca2a46ddef1ae69e6f8b205456fd3ae {
        width: 100%;
        margin: 0;
      }

      .inf-main_6ca2a46ddef1ae69e6f8b205456fd3ae > h4,
      .inf-main_6ca2a46ddef1ae69e6f8b205456fd3ae > span,
      .inf-rgpd {
        display: none;
      }

      .inf-content {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: baseline;
        gap: clamp(0.65rem, 1.15vw, 1rem);
      }

      .inf-input {
        min-width: 0;
      }

      .inf-input input[type="email"] {
        width: 100%;
        margin: 0;
        padding: 0 0 0.18em;
        border: 0;
        border-bottom: 3px solid var(--line-color);
        border-radius: 0;
        outline: 0;
        background: transparent;
        color: #000000;
        font: inherit;
        font-size: var(--interface-font-size);
        line-height: 0.95;
        letter-spacing: -0.045em;
        transition: border-color 180ms ease;
      }

      .inf-input input[type="email"]::placeholder {
        color: #000000;
        opacity: 1;
      }

      .inf-input input[type="email"]:hover,
      .inf-input input[type="email"]:focus-visible {
        border-color: var(--focus-color);
      }

      .inf-submit {
        --cloud-hit-width: calc(
          110% + clamp(7.7rem, 8.8vw, 9.9rem)
        );
        --cloud-hit-height: calc(
          110% + clamp(3.85rem, 5.5vw, 5.5rem)
        );

        position: relative;
        display: inline-grid;
        width: fit-content;
        min-width: 0;
        padding: 0;
        place-items: center;
        justify-self: end;
        align-self: baseline;
        transform: translateY(-0.08em);
        isolation: isolate;
      }

      .inf-submit::before {
        position: absolute;
        top: 50%;
        left: 50%;
        z-index: -1;
        width: var(--cloud-hit-width);
        height: var(--cloud-hit-height);
        content: "";
        background-color: var(--cloud-color);
        transform: translate(-50%, -50%);
        -webkit-mask:
          url("./nuage.svg?v=1")
          center / 100% 100%
          no-repeat;
        mask:
          url("./nuage.svg?v=1")
          center / 100% 100%
          no-repeat;
        transition: background-color 180ms ease;
        pointer-events: none;
      }

      .inf-submit:hover::before,
      .inf-submit:focus-within::before {
        background-color: var(--cloud-hover-color);
      }

      .inf-submit-label {
        position: relative;
        z-index: 1;
        display: block;
        color: #000000;
        font: inherit;
        font-size: var(--interface-font-size);
        font-weight: 400;
        line-height: 0.95;
        letter-spacing: -0.045em;
        text-align: center;
        pointer-events: none;
      }

      .inf-submit input[type="submit"] {
        appearance: none;
        position: absolute;
        top: 50%;
        left: 50%;
        z-index: 2;
        width: var(--cloud-hit-width);
        height: var(--cloud-hit-height);
        margin: 0 !important;
        padding: 0;
        border: 0;
        border-radius: 0;
        outline: 0;
        background: transparent;
        color: #000000;
        font-size: 0;
        transform: translate(-50%, -50%);
        cursor: pointer;
      }

      .inf-submit input[type="submit"]:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 0.18em;
      }

      .inf-success {
        width: min(100%, 70rem);
        margin: 0;
      }

      .inf-success h4 {
        max-width: 30ch;
        margin: 0;
        font-size: clamp(1.65rem, 3vw, 3rem);
        font-weight: 400;
        line-height: 1.02;
        letter-spacing: -0.04em;
      }

      .inf-success p {
        display: none;
      }

      altcha-widget {
        position: absolute;
        --altcha-color-base: transparent;
        --altcha-color-border: rgba(0, 0, 0, 0.45);
        --altcha-color-text: var(--text-color);
      }

      @media (max-width: 37.5rem) {
        :root {
          /*
           * The cloud extends below the submit text because it is absolutely
           * positioned. This larger mobile offset preserves a visible margin
           * beneath the complete SVG, including the iPhone safe area.
           */
          --form-bottom: calc(
            clamp(3rem, 5vh, 4rem) +
            env(safe-area-inset-bottom)
          );
          --newsletter-right-offset: 0rem;
          --interface-font-size: 2rem;
        }

        .inf-content {
          grid-template-columns: 1fr;
          align-items: stretch;
          gap: 0;
        }

        .inf-input {
          position: relative;
          order: 1;
          transform: translateY(-1rem);
        }

        .inf-input input[type="email"] {
          border-bottom: 0;
        }

        .inf-input::after {
          position: absolute;
          right: 0;
          bottom: 6px;
          left: 0;
          height: 3px;
          content: "";
          background: var(--line-color);
          pointer-events: none;
        }

        .inf-input:hover::after,
        .inf-input:focus-within::after {
          background: var(--focus-color);
        }

        .inf-submit {
          order: 2;
          z-index: 2;
          justify-self: center;
          align-self: auto;
          margin-top: 15px;
          transform: none;
        }

        .inf-submit input[type="submit"] {
          text-align: center;
        }
      }

      @media (max-width: 37.5rem) {
        .brand-lockup {
          width: min(
            var(--brand-width),
            calc(100vw - (2 * var(--brand-mobile-margin)))
          );
        }

        .brand-status {
          margin-top: 0.45rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
