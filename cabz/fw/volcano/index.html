<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>les voies du volcan</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;1,400&display=swap">
<style>
/* v05, les voies du volcan: minimal, slow, under the surface. At the top, the rim of a crater under a blue sky; scrolling
   down dives into it like a drone, into a deep red that moves slowly (the word soup). Every note floats in it as an
   unread badge: the number is how many messages its conversation has, and around it, now and then, a sign of what it is
   (voice, text, image). One + opens a composer. The pressure is felt as tremors; when it erupts the badges rise and
   leave the lava as words. Everything noisy is behind DEV. */
:root {
  --red: #ff3b30;
  --line: #f2f2f2;
  --dim: #8e8e93;
  --sys: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  --old: Spectral, Georgia, "Times New Roman", serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: #050506; color: var(--line); font: 13px/1.4 var(--sys); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }

/* the scene: the red field behind, the page that scrolls over it. The tremor moves both, never the controls */
#view { position: absolute; inset: 0; overflow: hidden; }
#field, #marks { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#marks { pointer-events: none; z-index: 1; }   /* the signs round the badges, and the words of an eruption: above everything in the scene */
#scroller { position: absolute; inset: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; outline: none; }
/* the dive: the rims stay on screen (sticky) while the scroll flies the camera over the near one and down into the crater */
#dive { position: relative; height: calc(var(--H, 100vh) + var(--D, 90vh)); }
#scene { position: sticky; top: 0; height: var(--H, 100vh); overflow: hidden; }
.layer { position: absolute; left: 0; bottom: -1px; width: 100%; height: 62%; display: block; will-change: transform, opacity; }
#far { transform-origin: 50% 70%; }
#near { transform-origin: 50% 100%; }
/* the lava: it begins where the dive ends, and lies over the end of it */
#soup { position: relative; z-index: 1; margin-top: calc(-1 * var(--H, 100vh)); height: 120%; overflow-x: clip; }

h1 { position: fixed; z-index: 4; top: 10px; left: 16px; margin: 0; font: 400 17px/30px var(--old); letter-spacing: .02em; color: rgba(242, 242, 242, .82); pointer-events: none; }

/* a note: an unread badge, like on an app icon */
.badge { position: absolute; left: 0; top: 0; width: var(--d, 22px); height: var(--d, 22px); padding: 0; border: 0; border-radius: 50%;
  display: grid; place-items: center; background: var(--red); color: #fff; cursor: pointer; will-change: transform;
  font: 600 calc(var(--d, 22px) * .56)/1 var(--sys); font-variant-numeric: tabular-nums; letter-spacing: -.02em; -webkit-tap-highlight-color: transparent; }
.badge[data-digits="2"] { font-size: calc(var(--d) * .46); }
.badge[data-digits="3"] { font-size: calc(var(--d) * .36); }
.badge.read { background: #000; color: transparent; transition: background-color 2s ease, color 2s ease; }   /* read: only the black disc */
.badge.out { visibility: hidden; }             /* above the lava, during an eruption, it is its words */
.badge:hover, .badge:focus-visible { z-index: 2; }
.badge:focus-visible { outline: 1.5px solid #fff; outline-offset: 3px; }
.badge .peek { position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%); font: 400 12px/1.3 var(--sys); letter-spacing: 0;
  color: #fff; white-space: nowrap; opacity: 0; transition: opacity .2s; pointer-events: none; text-shadow: 0 1px 8px rgba(0, 0, 0, .55); }
.badge.flip .peek { left: auto; right: calc(100% + 10px); }
@media (hover: hover) { .badge:hover .peek { opacity: 1; } }
.badge:focus-visible .peek { opacity: 1; }

/* the only control: + */
#plus { position: fixed; z-index: 5; left: calc(16px + env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: 48px; height: 48px; padding: 0; border: 0; border-radius: 50%; background: var(--red); display: grid; place-items: center; cursor: pointer;
  box-shadow: 0 2px 14px rgba(0, 0, 0, .35); -webkit-tap-highlight-color: transparent; }
#plus svg { width: 22px; height: 22px; }
#plus:focus-visible { outline: 1.5px solid #fff; outline-offset: 3px; }
body.composing #plus, body.chatting #plus { display: none; }

/* the composer, after Telegram's input bar: a round button, a dark rounded field, the mic in a dark circle */
.bar { display: flex; align-items: flex-end; gap: 8px; margin: 0; }
.round { flex: none; width: 44px; height: 44px; padding: 0; border: 1px solid rgba(255, 255, 255, .09); border-radius: 22px; background: #1c1c1d;
  color: #fff; display: grid; place-items: center; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background .2s, box-shadow .1s; }
.round svg { width: 22px; height: 22px; }
.round:focus-visible { outline: 1.5px solid rgba(255, 255, 255, .7); outline-offset: 2px; }
.msgfield:focus { border-color: rgba(255, 255, 255, .22); }   /* like Telegram: the caret is enough */
.you.named { width: auto; max-width: 8.5rem; padding: 0 14px; display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font: 500 14px/42px var(--sys); }
.mic.on { background: var(--red); border-color: var(--red); color: #000; }
.send { background: var(--red); border-color: var(--red); color: #fff; }
.msgfield { flex: 1; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 18px; border: 1px solid rgba(255, 255, 255, .09); border-radius: 22px;
  background: #1c1c1d; color: #fff; font: 400 17px var(--sys); outline: none; caret-color: #5e8bff; }
.msgfield::placeholder { color: #7d7d82; }
.fieldwrap { position: relative; flex: 1; min-width: 0; display: flex; }
.fieldwrap.with-clip .msgfield { padding-right: 46px; }
.clip { position: absolute; right: 4px; top: 4px; width: 36px; height: 36px; padding: 0; border: 0; border-radius: 18px; background: none; color: #8e8e93; display: grid; place-items: center; cursor: pointer; }
.clip svg { width: 22px; height: 22px; }
.clip:hover, .clip:focus-visible { color: #fff; }
.clip:focus-visible { outline: 1.5px solid rgba(255, 255, 255, .7); }
/* a picture about to be sent */
.att { position: relative; align-self: flex-start; margin: 0 0 8px 52px; padding: 6px; border-radius: 14px; background: #1c1c1d; border: 1px solid rgba(255, 255, 255, .09); }
.att img, .msg .photo { display: block; width: 72px; height: 72px; object-fit: cover; border-radius: 8px; }
.att button { position: absolute; top: -8px; right: -8px; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 12px; background: #2c2c2e; color: #fff; font: 600 14px/24px var(--sys); cursor: pointer; }
.msg .photo { width: auto; height: auto; max-width: 220px; max-height: 260px; margin-bottom: 6px; border-radius: 14px; }
#composer { position: fixed; z-index: 6; left: calc(8px + env(safe-area-inset-left, 0px)); right: calc(8px + env(safe-area-inset-right, 0px));
  bottom: calc(10px + env(safe-area-inset-bottom, 0px)); max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; }

/* name + secret code */
#idPanel { position: fixed; z-index: 8; left: calc(8px + env(safe-area-inset-left, 0px)); bottom: calc(64px + env(safe-area-inset-bottom, 0px));
  width: min(340px, calc(100% - 16px)); box-sizing: border-box; padding: 16px; border-radius: 20px; background: rgba(28, 28, 29, .97);
  border: 1px solid rgba(255, 255, 255, .09); box-shadow: 0 16px 50px rgba(0, 0, 0, .5); display: flex; flex-direction: column; gap: 12px; }
body.chatting #idPanel { left: auto; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
#idPanel p { margin: 0; font-size: 13px; line-height: 1.45; color: #aeaeb2; }
#idPanel label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--dim); }
#idPanel input, #idPanel select { height: 38px; box-sizing: border-box; padding: 0 12px; border: 1px solid rgba(255, 255, 255, .09); border-radius: 12px; background: #000; font-size: 16px; }
#preview { font-size: 13px; color: #fff; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { padding: 8px 14px; border: 0; border-radius: 999px; background: #2c2c2e; font-size: 13px; cursor: pointer; }
.pill.go { background: var(--red); color: #fff; }
.pill:disabled { opacity: .4; cursor: default; }

/* a note opened: the conversation */
#chat { position: fixed; z-index: 7; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(400px, calc(100% - 32px)); max-height: min(70%, 680px); display: flex; flex-direction: column; overflow: hidden;
  background: #0e0e0f; border: 1px solid rgba(255, 255, 255, .08); border-radius: 24px; box-shadow: 0 20px 60px rgba(0, 0, 0, .55); }
#chat header { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 18px; border-bottom: 1px solid rgba(255, 255, 255, .06); }
#cTitle { flex: 1; min-width: 0; font: 600 15px/1.2 var(--sys); }
#cTitle small { display: block; margin-top: 2px; font: 400 12px var(--sys); color: var(--dim); }
#chat header .round { width: 34px; height: 34px; }
#chat header .round svg { width: 16px; height: 16px; }
#listen[aria-pressed="true"] { background: #fff; color: #000; }
#cLog { list-style: none; margin: 0; padding: 14px 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; overscroll-behavior: contain; }
.msg { max-width: 84%; align-self: flex-start; }
.msg .body { margin: 0; padding: 8px 13px 9px; border-radius: 18px 18px 18px 6px; background: #262628; font: 400 15px/1.35 var(--sys); overflow-wrap: anywhere; }
.msg.op .body { background: #3b0d0a; font-size: 17px; }
.msg.mine { align-self: flex-end; }
.msg.mine .body { background: #a51d14; border-radius: 18px 18px 6px 18px; }
.msg .meta { margin: 4px 10px 0; font-size: 11px; color: var(--dim); }
.msg.mine .meta { text-align: right; }
#chat .bar { padding: 8px; border-top: 1px solid rgba(255, 255, 255, .06); }
@media (max-width: 600px) {
  #chat { left: calc(8px + env(safe-area-inset-left, 0px)); right: calc(8px + env(safe-area-inset-right, 0px)); bottom: calc(8px + env(safe-area-inset-bottom, 0px)); width: auto; max-height: 80%; }
  body.chatting #idPanel { left: calc(8px + env(safe-area-inset-left, 0px)); right: auto; }
}

/* DEV: the noisy tools */
#devBtn { position: fixed; z-index: 9; top: 8px; right: calc(10px + env(safe-area-inset-right, 0px)); padding: 6px; border: 0; background: none;
  font: 400 13px/1 var(--old); letter-spacing: .06em; color: #B026FF; cursor: pointer; }
#devBtn[aria-pressed="true"] { text-decoration: underline; text-underline-offset: 3px; }
#dev { position: fixed; z-index: 9; top: 36px; right: calc(10px + env(safe-area-inset-right, 0px)); width: min(260px, calc(100% - 20px)); box-sizing: border-box;
  max-height: calc(100% - 50px); overflow: auto; padding: 14px; border: 1px solid rgba(176, 38, 255, .55); border-radius: 14px; background: rgba(10, 10, 12, .9);
  font-size: 12px; display: grid; grid-template-columns: auto 1fr; gap: 10px 14px; align-items: start; }
#dev .full { grid-column: 1 / -1; }
#dev .k { color: var(--dim); }
#dev button.t { padding: 0; border: 0; background: none; color: #fff; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: rgba(255, 255, 255, .35); }
#dev .seg { display: flex; gap: 14px; }
#dev .seg button[aria-pressed="true"] { color: #B026FF; text-decoration-color: #B026FF; }
#tube { position: relative; width: 12px; height: 150px; grid-row: span 6; cursor: ns-resize; touch-action: none; border: 1px solid rgba(255, 255, 255, .5);
  background: repeating-linear-gradient(to top, transparent 0 calc(10% - 1px), rgba(255, 255, 255, .16) calc(10% - 1px) 10%); }
#tube:focus-visible { outline: 1px solid #fff; outline-offset: 4px; }
#pFill { position: absolute; left: 2px; right: 2px; bottom: 2px; height: 0; background: linear-gradient(to top, #5a0a05, #ff3b30 60%, #ffb3a8); }
#pBoom { justify-self: start; padding: 6px 12px; border: 1px solid var(--red); border-radius: 999px; background: none; color: #ffb3a8; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
#pBoom:disabled { opacity: .35; cursor: default; }
#dev input[type=range] { width: 100%; margin: 0; accent-color: #B026FF; }
.meter { height: 4px; background: rgba(255, 255, 255, .12); }
.meter span { display: block; height: 100%; width: 0; background: #fff; }
</style>

<h1>les voies du volcan</h1>

<button id="plus" type="button" aria-label="vent: write or say something"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16" stroke="#000" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg></button>

    <button id="cClose" class="round" type="button" aria-label="close" title="close"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>

  <div id="tube" role="slider" tabindex="0" aria-label="Pressure: drag to set it" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="pFill"></span></div>

<script>window.playhtmlReady = new Promise(r => { window.__playhtmlResolve = r; });</script>
<script type="module">
  // who is here at the same time is counted with playhtml (https://playhtml.fun): presence clears when a person leaves
  try {
    const { playhtml } = await import("https://unpkg.com/playhtml@2.15.0");
    await playhtml.init({ room: "langues" });   // a fixed room, so everyone meets whatever form of the address they typed
    window.__playhtmlResolve(playhtml);
  } catch (e) { console.warn("playhtml unavailable", e); window.__playhtmlResolve(null); }
</script>

<script>
// ================= basics =================
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const $ = id => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)");
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const view = $("view"), scroller = $("scroller"), soup = $("soup"), far = $("far"), near = $("near");
let W = 0, H = 0, D = 0, sized = "";            // D: how far the dive scrolls before you are in the lava
function resize() {
  const box = document.body.getBoundingClientRect();
  W = Math.round(box.width) || innerWidth; H = Math.round(box.height) || innerHeight; sized = W + "x" + H;
  D = Math.round(H * .9);
  document.documentElement.style.setProperty("--H", H + "px"); document.documentElement.style.setProperty("--D", D + "px");
  sizeField(); sizeMarks(); layoutSoup();
}

// ================= who is here =================
const hereEl = $("here");
const hereText = n => n === 0 ? "no one else" : n === 1 ? "one other" : `${n} others`;
(async () => {
  const ph = await window.playhtmlReady;
  let pr = null;
  try { pr = ph && ph.presence; } catch {}
  if (!pr) { hereEl.textContent = "can't tell"; return; }
  pr.setMyPresence("here", { t: Date.now() });
  const show = () => { let n = 0; for (const [, e] of pr.getPresences()) if (!e.isMe && e.here) n++; hereEl.textContent = hereText(n); };
  pr.onPresenceChange("here", show);
  setInterval(show, 2000);   // also notices people who leave
  show();
})();

// ================= identity: name + secret code (tripcode) =================
let me = { name: "", trip: "" };
try { const s = JSON.parse(localStorage.getItem("volcano-id") || "null"); if (s && s.name && s.trip) me = s; } catch {}
const ALPH = "abcdefghjkmnpqrstuvwxyz23456789";
async function tripcode(name, code) {
  const data = new TextEncoder().encode(name + "#" + code);
  let bytes;
  try { bytes = new Uint8Array(await crypto.subtle.digest("SHA-256", data)); }
  catch { let h = 2166136261; for (const b of data) h = Math.imul(h ^ b, 16777619); bytes = new Uint8Array(new Uint32Array([h, h * 31, h * 17]).buffer); }
  return [...bytes.slice(0, 6)].map(b => ALPH[b % ALPH.length]).join("");
}
const signature = (name, trip) => name ? `${name} ◆${trip}` : "anonymous";
const idPanel = $("idPanel"), nm = $("nm"), cd = $("cd"), preview = $("preview"), langSel = $("lang");
const ICON_YOU = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M5 19.5c1.2-3.6 4-5.4 7-5.4s5.8 1.8 7 5.4"/></svg>';
function showWho() {
  for (const b of document.querySelectorAll(".you")) {
    b.classList.toggle("named", !!me.name);
    if (me.name) b.textContent = me.name; else b.innerHTML = ICON_YOU;
    b.title = signature(me.name, me.trip);
  }
  $("devWho").textContent = signature(me.name, me.trip);
}
let idFrom = null;
function openId(from) {
  idFrom = from; idPanel.hidden = false;
  document.querySelectorAll(".you").forEach(b => b.setAttribute("aria-expanded", "true"));
  nm.value = me.name; cd.value = ""; updatePreview(); nm.focus({ preventScroll: true });
}
function closeId() {
  if (idPanel.hidden) return;
  idPanel.hidden = true;
  document.querySelectorAll(".you").forEach(b => b.setAttribute("aria-expanded", "false"));
  if (idFrom && idFrom.isConnected) idFrom.focus({ preventScroll: true });
  idFrom = null;
}
async function updatePreview() {
  const n = nm.value.trim();
  preview.textContent = n && cd.value ? signature(n, await tripcode(n, cd.value)) : n ? `${n} ◆ needs a code` : "anonymous";
  $("keep").disabled = !(n && cd.value);
}
nm.addEventListener("input", updatePreview); cd.addEventListener("input", updatePreview);
$("keep").addEventListener("click", async () => {
  const n = nm.value.trim(); if (!n || !cd.value) return;
  me = { name: n, trip: await tripcode(n, cd.value) };
  try { localStorage.setItem("volcano-id", JSON.stringify(me)); } catch {}
  closeId(); showWho();

const SR = window.SpeechRecognition || window.webkitSpeechRecognition, levelEl = $("level");
