<script src="../morph.js"></script>
<script>
  // a small git line next to the projects that have older versions (data from site.js)
  addEventListener("DOMContentLoaded", () => {
    const pp = window.CABZ && window.CABZ.sections.find((s) => s.id === "pp");
    if (!pp) return;
    document.querySelectorAll(".list a[data-morph]").forEach((a) => {
      const p = pp.projects.find((x) => a.getAttribute("href").startsWith(x.name + "/"));
      if (!p || p.versions.length < 2) return;
      const s = document.createElement("small");
      s.className = "vers";
      s.title = p.versions.length + " versions";
      s.innerHTML = p.versions.map(() => "<i></i>").join("");
      a.after(s);
    });
  });
</script>
<script src="../site.js" defer></script>
